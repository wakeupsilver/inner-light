orsoBones(vec2 p, inout float H, inout vec3 A, inout float C){\n  vec2 t=gT; float a=abs(t.x), h=0.;\n  // spine: stacked vertebrae with side wings, discs between\n  if(a<.14 && t.y>-.2 && t.y<gL+.05){\n    float v=fract(t.y/.088)-.5, wide=.05*(1.+.45*clamp(t.y/gL,0.,1.));\n    float bodyv=sqrt(max(1.-(a/wide)*(a/wide),0.))*smoothstep(.5,.34,abs(v));\n    float wing=.45*sqrt(max(1.-(a/.125)*(a/.125),0.))*smoothstep(.22,.05,abs(v));\n    float disc=.35*sqrt(max(1.-(a/(wide*.85))*(a/(wide*.85)),0.));\n    h=max(h, .05*max(max(bodyv,wing),disc));\n  }\n  // ribs: ten pairs sweeping out and down from the breastbone, swelling with the breath\n  float br=1.+.06*(uBreath-.5);\n  float ar=a/br, droop=.15*pow(ar/.45,1.6);\n  float rv=(t.y-droop-.045)/(.064*br), j=floor(rv), f=fract(rv)-.5;\n  if(j>=0. && j<=9.){\n    float wR=.2+.225*sin(PI*(j+2.5)/13.), inner=max(.03,(j-5.5)*.05);\n    if(ar<wR && ar>inner){\n      float wrap=sqrt(max(1.-(ar/wR)*(ar/wR),0.));\n      float thick=.27+.05*sin(ar*30.+j);\n      float tip=smoothstep(inner,inner+.03,ar);\n      h=max(h, .042*sqrt(max(1.-(f/thick)*(f/thick),0.))*(.35+.65*wrap)*tip);\n    }\n  }\n  // breastbone\n  float st=sdEllipse(vec2(a,t.y-.24),vec2(.036+.02*smoothstep(.14,.04,t.y),.23));\n  if(st<0.) h=max(h,.045*sqrt(clamp(-st/.036,0.,1.)));\n  // pelvis: two flared wings, sacrum, and the rings below\n  vec2 q=vec2(a,t.y-gL);\n  float wingE=sdEllipse(rot(-.55)*(q-vec2(.21,-.13)),vec2(.2,.125));\n  float hollow=sdEllipse(rot(-.55)*(q-vec2(.2,-.1)),vec2(.12,.06));\n  if(wingE<0.) h=max(h,.05*sqrt(clamp(-wingE/.1,0.,1.))*(.45+.55*smoothstep(-.03,.03,hollow)));\n  float sac=max(a-.085*(1.-(q.y+.12)/.3), max(-.16-q.y, q.y-.12));\n  if(sac<0.) h=max(h,.045*smoothstep(0.,-.03,sac)*(.75+.25*sin(q.y*90.)));\n  float ring=abs(sdEllipse(rot(.3)*(q-vec2(.1,.13)),vec2(.085,.06)))-.022;\n  if(ring<0.) h=max(h,.035*sqrt(clamp(-ring/.022,0.,1.)));\n  if(h>0.) put(h*gS, boneCol(p,h,.045), gTA, H,A,C);\n}\n\nvoid skull(vec2 p, inout float H, r, so the brain glows through it\n    float thin=mix(.9,.42,smoothstep(.02,.3,q.y))*(1.-.5*smoothstep(.0,-.05,holes));\n    put(h*gHS, col, smoothstep(0.,-.02,d)*gHA*thin, H,A,C);\n  }\n}\n\n// ------------------------------------------------------------------ organs\nvoid tube(vec2 q, vec2 a, vec2 b, float r, vec3 col, inout float H, inout vec3 A, inout float C){\n  vec3 c=capsule(q,a,b,0.,0.); float x=c.x/r;\n  if(x<1.) put(gS*(r*sqrt(1.-x*x)+.05), col*(.85+.15*sin(c.y*length(b-a)*260.)), gTA, H,A,C);\n}\n\nvoid organs(vec2 p, inout float H, inout vec3 A, inout float C, inout vec3 E){\n  vec2 t=gT; float beat=uBeat, br=1.+.09*(uBreath-.5);\n  vec2 hc=vec2(.07,.39);\n  // windpipe, ringed, forking to the lungs\n  { vec3 c=capsule(t,vec2(0.,-.14),vec2(0.,.2),0.,0.); float x=c.x/.024;\n    if(x<1.) put(gS*(.024*sqrt(1.-x*x)*(.85+.15*sin(t.y*290.))+.012), mix(vec3(.9,.76,.7),vec3(.66,.4,.44),smoothstep(-.3,.3,sin(t.y*290.))), gTA,H,A,C); }\n  tube(t,vec2(0.,.2),vec2(-.12,.3),.02,vec3(.85,.68,.66),H,A,C);\n  tube(t,vec2(0.,.2),vec2(.12,.3),.02,vec3(.85,.68,.66),H,A,C);\n  // lungs\n  for(int i=0;i<2;i++){\n    float s=i==0?-1.:1.;\n    vec2 lc=vec2(s*.205,.34), lr=vec2(.16,.275)*br;\n    float d=sdEllipse((t-lc)*vec2(1.,1.-.25*smoothstep(.2,.6,t.y)),lr);\n    d=max(d,.035-s*t.x);\n    if(s>0.) d=max(d,.135-length(t-hc-vec2(-.02,.03)));          // the notch where the heart rests\n    d=max(d,(t.y-.6)+.08*cos((t.x-s*.2)*9.));                     // domed floor\n    if(d<0.){\n      vec2 hil=vec2(s*.08,.3), q=t-hil; float rr=length(q);\n      float tree=ridge(vec2(atan(q.y,q.x*s)*2.2+gnoise(t*6.)*.6, rr*5.)+7.*float(i));\n      float bron=smoothstep(.62+rr*.9,.9+rr*.4,tree);\n      float twig=smoothstep(.8,.95,ridge(warp(t*24.,.25)))*keep(70.);\n      float alv=vnoise(t*230.)*keep(230.), alv2=vnoise(t*90.+3.)*keep(90.);\n      float lobe=smoothstep(.006,.0,abs(t.y-.34+s*(t.x-s*.2)*.9))+(s<0.?smoothstep(.006,.0,abs(t.y-.44-(t.x+.2)*.25)):0.);\n      float h=.085*sqrt(clamp(-d/.13,0.,1.))+.012*bron+.006*alv2-.01*lobe;\n      vec3 col=mix(vec3(.55,.28,.42),vec3(.95,.62,.68),alv2*.6+uBreath*.35);\n      col=mix(col,vec3(.98,.9,.86),bron*.85); col=mix(col,vec3(.75,.85,1.),twig*.5);\n      col*=.86+.2*alv; col=mix(col,vec3(.3,.1,.2),lobe*.6);\n      put(gS*h,col,gTA*smoothstep(0.,-.012,d),H,A,C);\n      E+=vec3(.35,.5,.9)*twig*uBreath*.25*gTA;\n    }\n  }\n  // great vessels\n  { vec2 q=t-hc;\n    float arch=abs(length(q-vec2(.035,-.17))-.062)-.026;\n    if(arch<0. && q.y<-.15) put(gS*(.026*sqrt(clamp(-arch/.026,0.,1.))+.1),vec3(.85,.12,.1)*(1.+.3*beat),gTA,H,A,C);\n    tube(t,hc+vec2(.097,-.16),hc+vec2(.085,.7),.024,vec3(.8,.1,.09)*(1.+.3*beat),H,A,C);      // descending aorta\n    tube(t,hc+vec2(-.027,-.16),hc+vec2(-.02,-.04),.027,vec3(.85,.12,.1),H,A,C);\n    tube(t,hc+vec2(-.085,-.3),hc+vec2(-.075,.62),.024,vec3(.25,.25,.75),H,A,C);                // vena cava\n    tube(t,hc+vec2(.02,-.1),hc+vec2(.11,-.2),.022,vec3(.45,.3,.8),H,A,C);                      // to the lungs\n    tube(t,hc+vec2(.0,-.1),hc+vec2(-.14,-.17),.02,vec3(.45,.3,.8),H,A,C);\n  }\n  // heart\n  { float sq=1.-.085*beat;\n    vec2 q=rot(.45)*((t-hc)/sq);\n    float d=smin(sdEllipse(q-vec2(0.,.02),vec2(.083,.112)), min(length(q-vec2(-.046,-.068))-.058,length(q-vec2(.05,-.064))-.056),.04);\n    d=smin(d, sdEllipse(q-vec2(-.01,.1),vec2(.04,.05)),.05);\n    if(d<0.){\n      float sept=smoothstep(.007,.0,abs(q.x-.008-.025*sin(q.y*14.)));\n      float groove=smoothstep(.008,.0,abs(q.y+.03-.02*cos(q.x*20.)));\n      float cor=smoothstep(.72,.9,ridge(warp(q*16.,.3)));\n      float fibr=.5+.5*sin((q.x*.8+q.y)*420.+gnoise(q*30.)*3.);\n      float h=.105*sqrt(clamp(-d/.1,0.,1.))-.012*sept-.008*groove+.008*cor+.003*fibr*keep(420.)+.13;\n      vec3 col=mix(vec3(.5,.02,.05),vec3(.95,.16,.14),fibr*keep(420.)*.5+.3+beat*.3);\n      col=mix(col,vec3(.25,.0,.04),max(sept,groove)*.7);\n      col=mix(col,q.x>0.?vec3(1.,.45,.3):vec3(.4,.35,.9),cor*.75);\n      col=mix(col,vec3(.9,.75,.5),smoothstep(-.02,-.07,q.y)*.25*vnoise(q*60.));          // fat at the crown\n      put(gS*h*sq,col,gTA*smoothstep(0.,-.01,d),H,A,C);\n    }\n    float r=length(t-hc);\n    E+=vec3(1.,.22,.12)*gTA*(exp(-r*r*55.)*(.25+beat*.9) + exp(-r*9.)*beat*.18);\n  }\n  // liver, stomach\n  { vec2 q=rot(.22)*(t-vec2(-.14,.735));\n    float d=sdEllipse(q,vec2(.235,.105)); d=max(d,-(q.y-.05-(q.x+.1)*.5)*.7-.12);\n    if(d<0.) put(gS*(.07*sqrt(clamp(-d/.1,0.,1.))+.01*vnoise(q*40.)),\n      mix(vec3(.42,.1,.08),vec3(.66,.22,.14),fbm3(q*18.))*(1.-.4*smoothstep(.008,.0,abs(q.x-.04-.3*q.y))),gTA*smoothstep(0.,-.012,d),H,A,C);\n    q=rot(-.55)*(t-vec2(.15,.75));\n    d=sdEllipse(q+vec2(0.,.04*q.x*q.x*60.-.02),vec2(.135,.08));\n    if(d<0.){ float ru=.5+.5*sin(q.y*170.+gnoise(q*22.)*3.);\n      put(gS*(.06*sqrt(clamp(-d/.08,0.,1.))+.006*ru*keep(170.)),mix(vec3(.75,.38,.36),vec3(.98,.68,.6),ru*keep(170.)),gTA*smoothstep(0.,-.012,d),H,A,C); }\n    d=length(t-vec2(-.1,.82))-.028;\n    if(d<0.) put(gS*(.03*sqrt(-d/.028)+.07),vec3(.3,.6,.25),gTA,H,A,C);\n  }\n  // gut: the large bowel frames the coiled small bowel\n  { vec2 q=t-vec2(0.,1.12); float d=sdEllipse(q,vec2(.3,.26)*vec2(1.,min(1.,(gL-.85)/.6+.4)));\n    if(d<0. && t.y>.82){\n      float frame=abs(d+.045)-.045;\n      if(frame<0.){\n        float along=atan(q.y,q.x)*9.; float bump=.75+.25*pow(abs(sin(along*3.)),.6);\n        put(gS*(.05*sqrt(clamp(-frame/.045,0.,1.))*bump+.01),mix(vec3(.72,.4,.36),vec3(.96,.7,.6),bump),gTA*smoothstep(.82,.86,t.y),H,A,C);\n      } else {\n        vec2 w=warp(q*4.5+.3,1.1);\n        float coil=fract((w.x*.9+w.y*.7)*7.)-.5;\n        float along=(w.x*.7-w.y*.9)*60.;\n        float prof=sqrt(max(1.-4.*coil*coil,0.));\n        put(gS*(.045*prof*(.85+.15*sin(along))+.004),mix(vec3(.6,.25,.28),vec3(.98,.66,.6),prof)*(.9+.1*sin(along)),gTA*smoothstep(.82,.86,t.y),H,A,C);\n      }\n    }\n  }\n}\n\nvoid brain(vec2 p, inout float H, inout vec3 A, inout float C, inout vec3 E){\n  vec2 q=gHq; float turn=sin(uHead[2].x)*.22;\n  vec2 c=q-vec2(-turn*.1,.27);\n  float d=sdEllipse(c,vec2(.315,.26)); d=max(d,-(c.y+.2+.25*c.x*c.x));\n  if(d<0.){\n    vec2 w=warp(c*9.,.55);\n    float fold=ridge(w*1.1), fine=ridge(w*3.2+4.);\n    float fis=smoothstep(.012,.0,abs(c.x+turn*.3-.006*sin(c.y*60.)));\n    float h=.1*sqrt(clamp(-d/.2,0.,1.))*(.72+.28*fold)+.006*fine*keep(40.)-.02*fis;\n    vec3 col=mix(vec3(.45,.22,.38),vec3(.98,.78,.8),smoothstep(.35,.9,fold));\n    col=mix(col,vec3(.75,.6,.95),fine*.25); col=mix(col,vec3(.2,.05,.2),fis*.8);\n    float fire=pow(vnoise(w*2.+uTime*vec2(.7,-.5)),6.);\n    col+=vec3(1.,.85,.4)*fire*1.2;\n    put(h*gHS,col,gHA*smoothstep(0.,-.015,d),H,A,C);\n    E+=vec3(.9,.7,1.)*gHA*(fire*.5+.06)*smoothstep(0.,-.1,d);\n  }\n}\n\n// a bright seam wherever a layer's surface creases or ends: the glowing contour of visionary anatomy\nfloat edgeGlow(float h){\n  float g=length(vec2(dFdx(h),dFdy(h)))/max(gPx*gS,1e-6);\n  return smoothstep(.6,3.,g)*.6;\n}\n\n// ------------------------------------------------------------------ everything inside the body\nvec3 innerEnergy(vec2 p, float m, float boneH, float boneC);\n\nvoid coords(vec2 p){\n  gPx=length(vec2(dFdx(p.x),dFdy(p.y)))*.7071/gS;\n  gL=1.45;\n  gT=vec2(dot(p-gO,gRt), dot(p-gO,-gUp)*1.45*gS/gLen)/gS;\n  gHq=vec2(dot(p-gHc,gHrt), dot(p-gHc,gHup))/gHS;\n}\n\nvec3 inner(vec2 p, float m){\n  coords(p);\n\n  vec3 col=fleshBase(p,m);\n  float H, C; vec3 A, E=vec3(0.);\n\n  H=0.; C=0.; A=vec3(0.);\n  if(uLayers[1]>.5){\n    torsoMuscle(p,H,A,C); limbMuscle(p,H,A,C);\n    float torsoDim=mix(1.,.55,smoothstep(.55,.38,abs(gT.x))*smoothstep(-.15,.15,gT.y)*smoothstep(gL+.1,gL-.1,gT.y)*gTA*max(uLayers[0],uLayers[2]));\n    col=mix(col, shade(A,H,.3,p), C*.94*torsoDim);\n    col+=vec3(1.,.45,.4)*edgeGlow(H)*.35*C;\n  }\n  H=0.; C=0.; A=vec3(0.);\n  if(uLayers[2]>.5){\n    organs(p,H,A,C,E); brain(p,H,A,C,E);\n    vec3 o=shade(A,H,.75,p);\n    col=mix(col, o, C*(.62+.34*gRim));\n    col+=A*C*.12;\n    col+=mix(A,vec3(1.,.8,.9),.5)*edgeGlow(H)*.5*C;\n  }\n  H=0.; C=0.; A=vec3(0.);\n  if(uLayers[0]>.5){\n    torsoBones(p,H,A,C); limbBones(p,H,A,C); skull(p,H,A,C);\n    vec3 b=shade(A,H,.4,p)*vec3(1.08,1.0,.86);\n    float ba=C*(.34+.5*gRim);                                   // glassy: solid at the edges, clear in the middle\n    col=mix(col, b, ba);\n    col+=vec3(1.,.9,.66)*C*(.05+.28*gRim) + vec3(1.,.82,.45)*edgeGlow(H)*.55*C;\n  }\n  col+=E*(.6+uIntensity*.6);\n  col+=innerEnergy(p,m,H,C);\n\n  // the skin: a thin luminous membrane at the body's edge\n  float rim=smoothstep(.97,.6,m);\n  col+=mix(vec3(.3,.55,1.),vec3(1.,.8,.95),rim)*rim*rim*.55;\n  return col;\n}\n",P="\n// a thin glowing strand: bright core, soft halo. d and w in the same units.\nfloat strand(float d, float w){ return smoothstep(w,w*.25,d) + exp(-d/w*.9)*.35; }\n\n// ------------------------------------------------------------------ vessels and nerves\nvec3 vessels(vec2 p, float m){\n  vec2 q=p/gS; vec3 col=vec3(0.);\n  float dH=length(p-gHeart)/gS;\n  float pulse=pow(.5+.5*cos(TAU*(dH*.9-uHeartPhase)),8.);          // a wave leaving the heart on every beat\n  float back=pow(.5+.5*cos(TAU*(dH*.7+uTime*.35)),5.);              // the slower return\n  // trunks running beside each limb bone\n  float art=0., ven=0.;\n  for(int i=0;i<24;i++){\n    if(i>=uNBones) break;\n    vec4 g=uBones[2*i], k=uBones[2*i+1]; int kind=int(k.z+.5);\n    if(k.w>.01 && kind!=4){\n      vec3 c=capsule(p,g.xy,g.zw,k.x,k.y); float R=mix(k.x,k.y,c.y), len=length(g.zw-g.xy)/gS;\n      if(c.x<R*.2){\n        float wob=sin(c.y*len*11.+float(i)*2.)*.1, w=R*.07;\n        art=max(art, strand(abs(c.z-R*(.42+wob)),w)*k.w);\n        ven=max(ven, strand(abs(c.z+R*(.45-wob)),w)*k.w);\n        // side branches peeling off the trunks\n        float bx=c.z/R, by=c.y*len*7.;\n        float tw=abs(fract(by+bx*1.4*sign(bx-.42))-.5);\n        art=max(art, strand(tw*R*.6,w*.45)*smoothstep(1.,.3,abs(bx))*k.w*.7);\n        float tv=abs(fract(by*1.1+.4-bx*1.3)-.5);\n        ven=max(ven, strand(tv*R*.6,w*.45)*smoothstep(1.,.3,abs(bx))*k.w*.6);\n      }\n    }\n  }\n  // carotids climbing the neck and fanning over the head\n  { float a=abs(gT.x);\n    float car=strand(abs(a-.075-.02*sin(gT.y*14.))*gS, gS*.011)*smoothstep(.1,-.02,gT.y)*smoothstep(-.75,-.5,gT.y);\n    art=max(art,car*gTA); }\n  // the branching web: three generations down to capillaries\n  // (zero-crossings of smooth noise make long unbroken winding lines, unlike thresholded ridges)\n  vec2 w1=warp(q*1.6,.8);\n  float ta=smoothstep(.05,.015,abs(gnoise(w1*2.3+vec2(0.,3.))))\n          +smoothstep(.07,.02,abs(gnoise(w1*5.5+vec2(5.,1.))))*.6*keep(20.)\n          +smoothstep(.10,.03,abs(gnoise(q*15.+w1*3.)))*.4*keep(60.)\n          +smoothstep(.12,.03,abs(gnoise(q*37.+7.)))*.22*keep(150.);\n  float tv=smoothstep(.05,.015,abs(gnoise(w1*2.1+vec2(9.,4.))))\n          +smoothstep(.07,.02,abs(gnoise(w1*5.1+vec2(2.,7.))))*.6*keep(20.)\n          +smoothstep(.10,.03,abs(gnoise(q*14.+w1*3.+3.)))*.4*keep(60.)\n          +smoothstep(.12,.03,abs(gnoise(q*35.+11.)))*.22*keep(150.);\n  art=max(art,ta*.75); ven=max(ven,tv*.7);\n  col+=mix(vec3(.9,.06,.05),vec3(1.,.75,.5),pulse*.8)*art*(.55+1.3*pulse);\n  col+=mix(vec3(.12,.2,.95),vec3(.5,.85,1.),back*.7)*ven*(.5+.7*back);\n  return col;\n}\n\nvec3 nerves(vec2 p, float m){\n  vec3 col=vec3(0.); vec2 t=gT; float a=abs(t.x);\n  float n=0., spark=0.;\n  // the cord inside the spine, and roots fanning from every vertebra\n  float cord=strand(a*gS, gS*.012)*smoothstep(-.75,-.55,t.y)*smoothstep(gL+.1,gL-.1,t.y);\n  n=max(n,cord*.7); spark+=cord*pow(.5+.5*cos(TAU*(t.y*2.2+uTime*1.1)),30.)*.6;\n  float rc=(t.y-a*.75-.07*sin(a*11.))/.088, rf=abs(fract(rc)-.5), rid=floor(rc);\n  float root=strand(rf*.088*gS, gS*.0055)*smoothstep(.62,.05,a)*smoothstep(-.3,-.1,t.y)*smoothstep(gL+.1,gL-.05,t.y);\n  n=max(n,root*.75);\n  spark+=root*pow(.5+.5*cos(TAU*(a*3.-uTime*(1.2+.5*hash11(rid))+hash11(rid+3.)*5.)),40.);\n  // the plexus behind the stomach
